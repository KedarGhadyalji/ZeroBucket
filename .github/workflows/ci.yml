name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.mysql-image }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zerobucket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          # The MYSQL_* names are understood by both the mysql and the mariadb images.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zerobucket_test
          MYSQL_USER: zerobucket
          MYSQL_PASSWORD: zerobucket
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mysql-image: ["mariadb:10.11"]
        include:
          # MySQL 8 differs from MariaDB (auth plugin, JSON/TIMESTAMP behaviour, UTC_TIMESTAMP), so run it once.
          - python-version: "3.12"
            mysql-image: "mysql:8.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        working-directory: packages/python
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: packages/python
        run: ruff check src/ tests/

      - name: Run tests
        working-directory: packages/python
        env:
          ZEROBUCKET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerobucket_test
          ZEROBUCKET_TEST_MYSQL_URL: mysql://zerobucket:zerobucket@127.0.0.1:3306/zerobucket_test
        run: pytest -v

  test-npm:
    name: Node ${{ matrix.node-version }} / ${{ matrix.mysql-image }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zerobucket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          # The MYSQL_* names are understood by both the mysql and the mariadb images.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zerobucket_test
          MYSQL_USER: zerobucket
          MYSQL_PASSWORD: zerobucket
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      moto:
        image: motoserver/moto:latest # S3-compatible server for the tiering tests
        ports:
          - 5000:5000

    env:
      ZEROBUCKET_TEST_S3_ENDPOINT: http://localhost:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1

    strategy:
      matrix:
        node-version: [20, 22, 24]
        mysql-image: ["mariadb:10.11"]
        include:
          - node-version: 22
            mysql-image: "mysql:8.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Install
        working-directory: packages/typescript
        run: npm ci

      - name: Typecheck
        working-directory: packages/typescript
        run: npm run typecheck

      - name: Build
        working-directory: packages/typescript
        run: npm run build

      - name: Run tests
        working-directory: packages/typescript
        env:
          ZEROBUCKET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerobucket_test
          ZEROBUCKET_TEST_MYSQL_URL: mysql://zerobucket:zerobucket@127.0.0.1:3306/zerobucket_test
        run: npm test

      # The Python half of the conformance harness needs its own, current Python. Without this step pip used the Ubuntu system
      # Python, saw "Requirement already satisfied: boto3" for the OS's boto3 1.34 and kept it. That version sends a Content-MD5
      # header on plain-HTTP uploads, the moto server echoes it back on every GET (ranged ones too), and the Node SDK then compares
      # it with each partial body: "Checksum mismatch ... in response header content-md5". Real S3 never sends that header on a GET.
      - name: Set up Python for the conformance harness
        if: matrix.node-version == 22
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cross-language conformance (Node <-> Python on one database)
        if: matrix.node-version == 22
        working-directory: packages/typescript
        env:
          ZEROBUCKET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerobucket_test
          ZEROBUCKET_TEST_MYSQL_URL: mysql://zerobucket:zerobucket@127.0.0.1:3306/zerobucket_test
        run: |
          python -m pip install -e "../python[s3,heic,mysql]"
          python -c "import boto3; print('boto3', boto3.__version__)"
          bash conformance/run.sh

      # npm rewrites some package.json values when publishing and says so in a warning that is easy to miss: "./dist/bin.js" became
      # "dist/bin.js" with a misleading "script name was invalid and removed" in a publish log. `npm pkg fix` is npm's own tool for
      # exactly this, so run it on a copy and fail if it would change anything. (Not `npm publish --dry-run`: that also asks the
      # registry, and fails with "cannot publish over the previously published versions" whenever the version is already released.)
      - name: package.json needs no npm auto-corrections
        if: matrix.node-version == 24
        working-directory: packages/typescript
        run: |
          cp package.json "$RUNNER_TEMP/package.before.json"
          npm pkg fix
          if ! diff -u "$RUNNER_TEMP/package.before.json" package.json; then
            echo "::error title=npm would rewrite package.json when publishing::run 'npm pkg fix' in packages/typescript and commit the result"
            exit 1
          fi

      - name: Example app (typecheck + end-to-end verify against the packed build)
        if: matrix.node-version == 22 && matrix.mysql-image == 'mariadb:10.11'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerobucket_test
        run: |
          (cd packages/typescript && npm pack --pack-destination "$RUNNER_TEMP")
          cd examples/node-integration
          npm install --no-audit --no-fund "$RUNNER_TEMP"/zerobucket-*.tgz
          npm run typecheck
          npm run verify

      - name: Benchmarks (typecheck + quick smoke run against the packed build)
        if: matrix.node-version == 22 && matrix.mysql-image == 'mariadb:10.11'
        env:
          ZEROBUCKET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerobucket_test
          ZEROBUCKET_TEST_MYSQL_URL: mysql://zerobucket:zerobucket@127.0.0.1:3306/zerobucket_test
        run: |
          (cd packages/typescript && npm pack --pack-destination "$RUNNER_TEMP")
          cd benchmarks/node
          npm install --no-audit --no-fund "$RUNNER_TEMP"/zerobucket-*.tgz
          npm run typecheck
          npm run bench:quick
          npm run compression

  # GitHub's Windows runners cannot run service containers, so these jobs have no PostgreSQL, MySQL or S3 server. The tests for
  # those backends skip themselves when their ZEROBUCKET_TEST_* setting is missing; what runs is everything that needs only
  # SQLite and the filesystem, which is where the Windows-only bugs (locked files, path separators, CRLF) have been.
  test-windows:
    name: Python 3.12 / Windows (SQLite only)
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        working-directory: packages/python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/python
        run: pytest -v

  test-npm-windows:
    name: Node 22 / Windows (SQLite only)
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      # --ignore-scripts: from a lockfile, npm runs better-sqlite3's install script, which compiles it with node-gyp and needs
      # Visual Studio, even though the package ships a Windows binary. Nothing else in the lockfile needs its install scripts
      # (esbuild finds its binary through its platform package).
      - name: Install
        working-directory: packages/typescript
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: packages/typescript
        run: npm run typecheck

      - name: Build
        working-directory: packages/typescript
        run: npm run build

      - name: Run tests
        working-directory: packages/typescript
        run: npm test
