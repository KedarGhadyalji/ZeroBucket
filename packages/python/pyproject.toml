[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerobucket"
version = "0.1.0"
description = "Database-native image storage. Your database. Your images. Zero buckets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ZeroBucket contributors" }]
keywords = ["image", "storage", "postgresql", "bytea", "s3-alternative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/zerobucket/zerobucket"
Repository = "https://github.com/zerobucket/zerobucket"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobucket"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
