[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerobucket"
version = "0.9.0"
description = "Database-native image storage. Your database. Your images. Zero buckets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kedar Ghadyalji", email = "your-email@example.com" }]
keywords = ["image", "storage", "postgresql", "bytea", "s3-alternative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
heic = [
    "pillow-heif>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scikit-image>=0.22",
    "numpy>=1.26",
    "pillow-heif>=0.13",
]

[project.scripts]
zerobucket = "zerobucket.cli:main"

[project.urls]
Homepage = "https://github.com/KedarGhadyalji/ZeroBucket"
Repository = "https://github.com/KedarGhadyalji/ZeroBucket"
Issues = "https://github.com/KedarGhadyalji/ZeroBucket/issues"
Changelog = "https://github.com/KedarGhadyalji/ZeroBucket/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobucket"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]