[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-zerobucket"
version = "0.1.0"
description = "Django Storage backend for ZeroBucket -- database-native image storage via FileField/ImageField."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kedar Ghadyalji", email = "your-email@example.com" }]
keywords = ["django", "image", "storage", "postgresql", "zerobucket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2",
    "zerobucket>=0.15.0",
]

[project.optional-dependencies]
s3 = [
    "zerobucket[s3]>=0.15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "boto3>=1.34",
    "moto[s3]>=5.0",
]

[project.urls]
Homepage = "https://github.com/KedarGhadyalji/ZeroBucket"
Repository = "https://github.com/KedarGhadyalji/ZeroBucket"
Issues = "https://github.com/KedarGhadyalji/ZeroBucket/issues"
Changelog = "https://github.com/KedarGhadyalji/ZeroBucket/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/django_zerobucket"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
testpaths = ["tests"]